[project]
name = "spelling-dialect"
version = "1.0.0"
description = "Keep a repo in one English spelling, American or British, including inside identifiers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Eric Dahl" }]

[project.scripts]
spelling-dialect = "spelling_dialect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["spelling_dialect.py"]
